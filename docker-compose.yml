# One file runs the whole stack with hot reload:
#
#   docker compose up --build
#
#   frontend (Next.js dev server, HMR) -> http://localhost:3000
#   backend  (uvicorn --reload)        -> http://localhost:8000/docs
#   database -> disposable SQLite, recreated on backend startup (no DB container)
#
# Docker Compose has no built-in --dev/--prod switch and volume mounts can't be
# toggled by env vars, so this single file is tuned for local development.
# The Dockerfiles still keep production stages (frontend `runner`, backend's
# default CMD) for real deployment via `docker build`.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: swisshacks-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      # SQLite lives in a dedicated subdir backed by a named volume
      - DATABASE_URL=sqlite+aiosqlite:///./data/db/risk_platform.db
      # Optional: pass your Claude key through from the host (or backend/.env)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Optional: ZEFIX Basic-auth account (free; from zefix@bj.admin.ch).
      # Absent → ZefixAdapter degrades gracefully, the engine still runs.
      - ZEFIX_USERNAME=${ZEFIX_USERNAME:-}
      - ZEFIX_PASSWORD=${ZEFIX_PASSWORD:-}
      # macOS bind mounts don't deliver inotify events — poll so --reload works
      - WATCHFILES_FORCE_POLLING=true
    env_file:
      # Optional — container runs fine without it (sensible defaults apply)
      - path: ./backend/.env
        required: false
    # Hot reload: uvicorn watches the bind-mounted app source
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /home/app/app
    volumes:
      # Live backend code (overlays the copy baked into the image)
      - ./backend/app:/home/app/app
      # Keep SQLite files outside the source bind mount. The application drops
      # and recreates the schema on every backend startup.
      - backend_data:/home/app/data/db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - swisshacks

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # next dev (hot reload). Production stage is `runner`.
      target: dev
    container_name: swisshacks-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      # Next.js rewrites proxy /api/backend/* to the backend service
      - BACKEND_INTERNAL_URL=http://backend:8000
      # macOS bind mounts: force polling so Next.js HMR sees changes
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      # Live frontend source...
      - ./frontend:/app
      # ...but keep the image's installed deps and build cache
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - swisshacks

  # Backend test suite (pytest) in a container — no local Python needed:
  #   docker compose run --rm backend-tests
  # Profiled, so it never starts on `docker compose up`.
  backend-tests:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: test
    profiles: ["test"]
    environment:
      - ENVIRONMENT=development
      # Tests use their own in-memory DB; keep the module engine off disk too.
      - "DATABASE_URL=sqlite+aiosqlite:///:memory:"
    volumes:
      # Live source + tests, so edits run without rebuilding the image.
      - ./backend:/app

networks:
  swisshacks:
    driver: bridge

volumes:
  backend_data:
