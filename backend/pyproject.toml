[project]
name = "swisshacks-backend"
version = "0.1.0"
description = "Risk Intelligence Platform for SwissHacks 2026"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # Required by pydantic EmailStr (app/schemas/client.py)
    "email-validator>=2.0.0",
    "sse-starlette>=2.1.0",
    
    # Database
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0",
    
    # ML core
    "xgboost>=2.1.0",
    "scikit-learn>=1.5.0",
    "shap>=0.46.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "joblib>=1.4.0",

    # Drift Engine (AMINA Challenge 4): BOCPD + ownership contagion
    "scipy>=1.13.0",
    "networkx>=3.3",
    
    # Counterfactuals (наш дифференциатор)
    "dice-ml>=0.11",
    
    # LLM
    "anthropic>=0.39.0",
    
    # Logging
    "structlog>=24.4.0",
    
    # CORS, etc.
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",

    # GDELT 2.0 free news feed (sources/gdelt.py — Event Registry fallback)
    "gdeltdoc>=1.5.0",
    
    # YAML for jurisdiction rules
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-bdd>=7.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

# Audio processing для AMINA voice analysis
audio = [
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "resemblyzer>=0.1.4",
]

# Semantic website-drift detection (drift/business_model.py — UC 9, 10).
# model2vec runs static MiniLM-distilled embeddings on pure NumPy (no torch),
# so the comparator stays optional and the core image lean. Absent → the
# comparator degrades to no signal; present → cosine distance fires UC 9.
embeddings = [
    "model2vec>=0.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
